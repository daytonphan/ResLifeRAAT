 <!DOCTYPE html>
 <html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UC Berkeley Resident-Assistant Administrative Tool</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <div class="container">
            <h1>UC Berkeley RAAT</h1>
            <p>Convert Roompact duty schedule CSV exports into calendar (.ics) files for Calendar platforms.</p>
            <input type="file" id="csvFileInput" accept=".csv" />
            <div class="controls">
                <button id="convertButton">Convert file to .ics</button>
            </div>
            <script type="module" src="popup.js"></script>
        </div>
    </body>
 </html>
